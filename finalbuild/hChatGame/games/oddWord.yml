settings:
  enable: true
  global:
    chat:
      enable: false
      symbol: "!"
  durationSeconds: 30
  actions:
    start:
      - "[BROADCAST] "
      - "[BROADCAST] {prefix} <#F8BEFB>Лишнее слово"
      - "[BROADCAST] <gray>● <white>Найди лишнее слово: <#F8BEFB>{words}"
      - "[BROADCAST] "
    end:
      - "[BROADCAST] {prefix} <green>Победил <#F8BEFB>{player}<white>! Ответ: <#F8BEFB>{answer}"
      - "[CONSOLE] p give {player} 1"
    timeout:
      - "[BROADCAST] {prefix} Время вышло! Правильный ответ<gray>: <#F8BEFB>{answer}"
  puzzles:
    - words: ["берёза","дуб","сосна","ромашка"]
      answers: ["ромашка"]
    - words: ["яблоко","груша","слива","велосипед"]
      answers: ["велосипед"]
    - words: ["кирка","лопата","топор","хлеб"]
      answers: ["хлеб"]
    - words: ["красный","зелёный","синий","сундук"]
      answers: ["сундук"]
    - words: ["Меркурий","Венера","Марс","Луна"]
      answers: ["Луна"]
    - words: ["корова","свинья","овца","крипер"]
      answers: ["крипер"]
    - words: ["зомби","скелет","крипер","курица"]
      answers: ["курица"]
    - words: ["железо","золото","медь","дуб"]
      answers: ["дуб"]
    - words: ["зима","весна","лето","вторник"]
      answers: ["вторник"]
    - words: ["понедельник","среда","пятница","осень"]
      answers: ["осень"]
    - words: ["треугольник","квадрат","круг","январь"]
      answers: ["январь"]
    - words: ["пианино","гитара","скрипка","морковь"]
      answers: ["морковь"]
    - words: ["январь","март","июнь","суббота"]
      answers: ["суббота"]
    - words: ["два","четыре","шесть","три"]
      answers: ["три"]
    - words: ["тигр","лев","леопард","карась"]
      answers: ["карась"]
    - words: ["воробей","ворона","синица","щука"]
      answers: ["щука"]
    - words: ["поезд","автобус","трамвай","чайник"]
      answers: ["чайник"]
    - words: ["футбол","хоккей","теннис","шахта"]
      answers: ["шахта"]
    - words: ["шлем","нагрудник","поножи","компас"]
      answers: ["компас"]
    - words: ["зельеварка","печь","верстак","снежок"]
      answers: ["снежок"]

